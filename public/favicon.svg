<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#10b981"/>
  <g transform="translate(96, 96)">
    <!-- Coin/body -->
    <circle cx="160" cy="160" r="140" fill="#059669" stroke="#fff" stroke-width="12"/>
    <!-- Euro symbol -->
    <text x="160" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="white">€</text>
    <!-- Small sparkles -->
    <circle cx="45" cy="40" r="12" fill="#fbbf24" opacity="0.9"/>
    <circle cx="280" cy="50" r="8" fill="#fbbf24" opacity="0.7"/>
    <circle cx="60" cy="260" r="6" fill="#fbbf24" opacity="0.6"/>
    <circle cx="290" cy="270" r="10" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
